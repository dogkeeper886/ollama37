<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="220" fill="#ffffff"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Modern LLMs on a 2014 GPU</text>

  <!-- K80 -->
  <rect x="24" y="84" width="184" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="116" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Tesla K80</text>
  <text x="116" y="148" text-anchor="middle" font-size="13" fill="#57606a">2014 · CUDA cc 3.7</text>

  <!-- arrow -->
  <line x1="214" y1="130" x2="262" y2="130" stroke="#8c959f" stroke-width="2"/>
  <polygon points="262,124 274,130 262,136" fill="#8c959f"/>

  <!-- ollama37 -->
  <rect x="280" y="78" width="160" height="104" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="360" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#0969da">Ollama37</text>
  <text x="360" y="146" text-anchor="middle" font-size="13" fill="#0969da">adds sm_37 support</text>

  <!-- arrow -->
  <line x1="446" y1="130" x2="494" y2="130" stroke="#8c959f" stroke-width="2"/>
  <polygon points="494,124 506,130 494,136" fill="#8c959f"/>

  <!-- LLMs -->
  <rect x="512" y="84" width="184" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="604" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Modern LLMs</text>
  <text x="604" y="148" text-anchor="middle" font-size="13" fill="#57606a">Gemma · Qwen · DeepSeek</text>
</svg>
