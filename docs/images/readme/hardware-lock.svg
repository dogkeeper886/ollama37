<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">The official image runs on Tesla K80 only</text>

  <!-- image box -->
  <rect x="180" y="60" width="360" height="62" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="360" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#7d4e00">ollama37 image</text>
  <text x="360" y="107" text-anchor="middle" font-size="13" fill="#7d4e00">native CUBIN, compiled for sm_37 — no PTX fallback</text>

  <!-- connector -->
  <line x1="360" y1="122" x2="360" y2="150" stroke="#8c959f" stroke-width="2"/>
  <polygon points="354,150 360,162 366,150" fill="#8c959f"/>

  <!-- runs row -->
  <rect x="120" y="172" width="480" height="44" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
  <text x="148" y="199" font-size="20" font-weight="700" fill="#1a7f37">✓</text>
  <text x="178" y="194" font-size="15" font-weight="700" fill="#1f2328">Tesla K80</text>
  <text x="178" y="210" font-size="12" fill="#57606a">sm_37 — runs</text>
  <text x="580" y="199" text-anchor="end" font-size="13" font-weight="700" fill="#1a7f37">SUPPORTED</text>

  <!-- fail row 1 -->
  <rect x="120" y="224" width="480" height="40" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="148" y="249" font-size="18" font-weight="700" fill="#cf222e">✗</text>
  <text x="178" y="249" font-size="14" fill="#1f2328">Tesla P100 — sm_60</text>
  <text x="580" y="249" text-anchor="end" font-size="12" font-weight="700" fill="#cf222e">won't load</text>

  <!-- fail row 2 -->
  <rect x="120" y="272" width="480" height="40" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="148" y="297" font-size="18" font-weight="700" fill="#cf222e">✗</text>
  <text x="178" y="297" font-size="14" fill="#1f2328">V100 · RTX 20–30 series — sm_70 to sm_86</text>
  <text x="580" y="297" text-anchor="end" font-size="12" font-weight="700" fill="#cf222e">won't load</text>
</svg>
