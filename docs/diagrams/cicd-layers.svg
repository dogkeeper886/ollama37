<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="880" height="300" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">One runner, three layers</text>
  <g font-size="14" fill="#222">
    <rect x="20" y="60" width="250" height="170" rx="10" fill="#e8f0fe" stroke="#4a6fb5"/>
    <text x="145" y="88" text-anchor="middle" font-weight="bold">1 · Workflow</text>
    <text x="145" y="115" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">.github/workflows/test-*.yml</text>
    <text x="145" y="145" text-anchor="middle">picks a host by label</text>
    <text x="145" y="170" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">runs-on: [self-hosted,</text>
    <text x="145" y="188" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">runner_label]</text>
    <text x="145" y="215" text-anchor="middle" font-size="12" fill="#555">sm37 · sm61 · sm86</text>

    <rect x="315" y="60" width="250" height="170" rx="10" fill="#e6f4ea" stroke="#3c8a55"/>
    <text x="440" y="88" text-anchor="middle" font-weight="bold">2 · Runner CLI</text>
    <text x="440" y="115" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">cicd/tests/src/cli.ts</text>
    <text x="440" y="145" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">run · judge · list</text>
    <text x="440" y="168" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">bench-throughput</text>
    <text x="440" y="186" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">bench-context · test-mcp</text>
    <text x="440" y="204" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">model-bounds</text>

    <rect x="610" y="60" width="250" height="170" rx="10" fill="#fef7e0" stroke="#b58a1b"/>
    <text x="735" y="88" text-anchor="middle" font-weight="bold">3 · Testcases</text>
    <text x="735" y="115" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">cicd/tests/testcases/</text>
    <text x="735" y="133" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">&lt;suite&gt;/TC-*.yml</text>
    <text x="735" y="163" text-anchor="middle">steps = bash commands</text>
    <text x="735" y="188" text-anchor="middle">build · runtime ·</text>
    <text x="735" y="208" text-anchor="middle">inference · models</text>
  </g>
  <line x1="270" y1="145" x2="312" y2="145" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="565" y1="145" x2="607" y2="145" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="275" text-anchor="middle" font-size="13" fill="#444">Local and CI runs call the same cli.ts; a workflow only adds the host and the steps around it.</text>
</svg>
