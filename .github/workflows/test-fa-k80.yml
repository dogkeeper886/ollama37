name: K80 FA Validation

# Regression test + benchmark for K80 flash attention support
# (issue #108 / PR #117). Two modes:
#
# 1. Single-run (default): one inference, optionally with an FA-off baseline.
#    Use kv_cache_type / baseline_compare inputs to control. Good for quick
#    smoke tests.
#
# 2. Benchmark (benchmark=true): runs three configs back-to-back and emits
#    a markdown comparison table to the workflow log:
#      A. FA off, KV f16
#      B. FA on,  KV f16
#      C. FA on,  KV q8_0
#    Captures KV cache size, total VRAM (nvidia-smi), and tokens/sec per
#    config. Use num_ctx + num_predict + model + prompt to vary the workload.
#
# Test logic lives in the TS runner (cicd/tests: `cli.ts test-fa`); this YAML
# orchestrates container lifecycle (stop production → run → restart production
# → upload artifacts).

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip the rebuild step (assume ollama37:latest already has the FA patch)"
        required: false
        default: false
        type: boolean
      benchmark:
        description: "Run all three configs (off-f16, on-f16, on-q8_0) and emit a comparison table"
        required: false
        default: false
        type: boolean
      model:
        description: "Model to test (must be pre-pulled in ollama-data volume)"
        required: false
        default: "gemma3:4b"
        type: string
      prompt:
        description: "Inference prompt (deterministic; temp=0)"
        required: false
        default: "Write a detailed multi-paragraph explanation of how large language models work. Cover tokenization, attention mechanisms, training procedures, and inference. Be thorough."
        type: string
      num_predict:
        description: "Number of tokens to generate"
        required: false
        default: "256"
        type: string
      num_ctx:
        description: "Context window size (4096, 16384, 32768, etc.)"
        required: false
        default: "4096"
        type: string
      kv_cache_type:
        description: "(single-run mode only) OLLAMA_KV_CACHE_TYPE value (empty = f16; q8_0 or q4_0 to test KV quant)"
        required: false
        default: ""
        type: string
      baseline_compare:
        description: "(single-run mode only) Run FA-off baseline first and diff against FA-on output"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build patched image
    if: ${{ !inputs.skip_build }}
    uses: ./.github/workflows/test-build.yml
    with:
      debug: false

  # Recreate the production ollama37 container from the freshly built image.
  # Without this, the existing container instance keeps its old image even
  # though `ollama37:latest` on disk is new; subsequent `docker start ollama37`
  # would bring the stale container back online. TC-RUNTIME-001 runs
  # `docker compose down && up -d`, which picks up the new image.
  runtime:
    name: Recreate runtime container on new image
    needs: build
    if: ${{ !inputs.skip_build && needs.build.result == 'success' }}
    uses: ./.github/workflows/test-runtime.yml
    with:
      debug: false

  validate:
    name: FA inference + log capture
    needs: [build, runtime]
    if: ${{ always() && (inputs.skip_build || (needs.build.result == 'success' && needs.runtime.result == 'success')) }}
    runs-on: self-hosted
    environment: cicd-1
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Stop existing ollama37 container
        run: |
          docker stop ollama37 || true
          # Defensive: clear any stale FA-test containers from prior failed runs.
          docker rm -f ollama37-fa-test \
                       ollama37-fa-test-baseline ollama37-fa-test-fa \
                       ollama37-fa-test-off-f16 ollama37-fa-test-on-f16 \
                       ollama37-fa-test-on-q8_0 2>/dev/null || true

          # Poll until VRAM drops below 1 GiB or 30s timeout.
          for i in $(seq 1 30); do
            USED=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -1 | tr -d ' ')
            if [ "$USED" -lt 1024 ]; then
              echo "VRAM released after ${i}s: ${USED} MiB"
              break
            fi
            sleep 1
          done
          nvidia-smi --query-gpu=memory.used --format=csv,noheader

      - name: Run FA validation
        env:
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
          NUM_PREDICT: ${{ inputs.num_predict }}
          NUM_CTX: ${{ inputs.num_ctx }}
          BENCHMARK: ${{ inputs.benchmark }}
          KV_CACHE_TYPE: ${{ inputs.kv_cache_type }}
          BASELINE_COMPARE: ${{ inputs.baseline_compare }}
          # Keyless agent judge auth. Falls back to the runner's ambient
          # ~/.claude if the secret is unset.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd cicd/tests
          ARGS=(
            --model "$MODEL"
            --prompt "$PROMPT"
            --num-predict "$NUM_PREDICT"
            --num-ctx "$NUM_CTX"
            --output /tmp/test-fa-k80-results.json
          )
          if [ "$BENCHMARK" = "true" ]; then
            ARGS+=(--benchmark)
          fi
          if [ -n "$KV_CACHE_TYPE" ]; then
            ARGS+=(--kv-cache-type "$KV_CACHE_TYPE")
          fi
          if [ "$BASELINE_COMPARE" = "true" ]; then
            ARGS+=(--baseline-compare)
          fi

          # The subcommand emits the benchmark + judge markdown tables on stdout
          # (→ step summary) and writes the JSON report to --output.
          npx tsx src/cli.ts test-fa "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restart production ollama37
        if: always()
        run: |
          # Defensive cleanup of any leftover test containers.
          docker rm -f ollama37-fa-test \
                       ollama37-fa-test-baseline ollama37-fa-test-fa \
                       ollama37-fa-test-off-f16 ollama37-fa-test-on-f16 \
                       ollama37-fa-test-on-q8_0 2>/dev/null || true

          if docker ps -a --filter "name=^ollama37$" --format '{{.Names}}' | grep -q ollama37; then
            docker start ollama37 || true
          else
            cd docker && docker compose up -d || true
          fi

      - name: Verify production ollama37 recovered
        if: always()
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "production ollama37 healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::production ollama37 did not recover within 60s"
          docker logs ollama37 2>&1 | tail -50 || true
          exit 1

      - name: Upload FA test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa-test-${{ github.run_id }}
          path: |
            /tmp/fa-test/
            /tmp/test-fa-k80-results.json
          retention-days: 30
