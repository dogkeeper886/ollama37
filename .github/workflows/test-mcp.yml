name: MCP Tool-Call Test

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to test (space-separated)"
        required: true
        default: "gemma4:e4b"
        type: string
      prompt:
        description: "Prompt that should trigger a tool call"
        required: false
        default: "List the projects."
        type: string
      num_ctx:
        description: "Context window size (8192 fits a merged multi-server tool menu; one server fits in 4096)"
        required: false
        default: "8192"
        type: string
      timeout:
        description: "Per-call Ollama response timeout (seconds) — a multi-server menu on the K80 takes ~18 min/round; a single server is far faster"
        required: false
        default: "1800"
        type: string
      judge_mode:
        description: "Verification mode (simple = structural check; dual = also run the keyless agent judge for groundedness; verify-live = the keyless verifier calls the server's read-only tools itself and checks the answer against LIVE data)"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
          - "verify-live"
      verify_allow:
        description: "verify-live only: comma-separated exact read-only tool names the verifier may call (fail-closed)"
        required: false
        default: "list_projects"
        type: string
      verify_server_name:
        description: "verify-live only: mcp__<name>__<tool> label the verifier registers the server under"
        required: false
        default: "testlink"
        type: string
      mcp_command:
        description: "Command to launch the stdio MCP server"
        required: false
        default: "docker"
        type: string
      mcp_args:
        description: "Args for the MCP server (space-separated)"
        required: false
        default: "run --rm -i -e TESTLINK_URL -e TESTLINK_API_KEY dogkeeper886/testlink-mcp:latest"
        type: string
      distractor_command:
        description: "Optional second (menu-only) MCP server command, e.g. npx for Playwright — its tools become distractors the model must NOT pick (the verifier never touches it). Leave empty for one server."
        required: false
        default: ""
        type: string
      distractor_args:
        description: "Args for the distractor MCP server, e.g. @playwright/mcp@latest"
        required: false
        default: ""
        type: string
      runner_label:
        description: "Which GPU testbed to run on. sm37 = Tesla K80 (reference). sm75 = RTX 2060 (models must fit ~5.1 GiB)."
        required: false
        default: "sm37"
        type: choice
        options:
          - "sm37"
          - "sm75"
      num_batch:
        description: "num_batch (micro-batch) per request. Empty = model default (512). Lower shrinks the Q·Kᵀ compute-graph reservation at long context."
        required: false
        default: ""
        type: string

env:
  OLLAMA_HOST: http://localhost:11434

jobs:
  test-mcp:
    name: MCP Tool-Call Test
    runs-on: [self-hosted, "${{ inputs.runner_label || 'sm37' }}"]
    environment: cicd-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify host
        uses: ./.github/actions/identify-host

      - name: Validate inputs
        env:
          MODELS: ${{ inputs.models }}
          NUM_BATCH: ${{ inputs.num_batch }}
        run: |
          # Only allow model name characters: alphanumeric, colon, dot, dash, underscore, slash, space
          if ! echo "$MODELS" | grep -qE '^[a-zA-Z0-9:._/ -]+$'; then
            echo "ERROR: Invalid characters in model names: $MODELS" >&2
            exit 1
          fi
          # num_batch, if given, must be a bare positive integer (it is spliced into a shell command).
          if [ -n "$NUM_BATCH" ] && ! echo "$NUM_BATCH" | grep -qE '^[1-9][0-9]*$'; then
            echo "ERROR: num_batch must be a positive integer, got: $NUM_BATCH" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Run MCP tool-call test
        env:
          MODELS: ${{ inputs.models }}
          NUM_BATCH: ${{ inputs.num_batch }}
          # Keyless auth for the agent judge (dual) and the live verifier (verify-live).
          # On this self-hosted runner the verifier symlinks the ambient ~/.claude token, so the
          # secret is only needed where ~/.claude is absent.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # testlink-mcp creds. Forwarded to the spawned server via --mcp-env.
          # Without them the run degrades cleanly (errors / NO TOOL SUPPORT surfaced).
          TESTLINK_URL: ${{ secrets.TESTLINK_URL }}
          TESTLINK_API_KEY: ${{ secrets.TESTLINK_API_KEY }}
        run: |
          # pipefail so the test runner's exit code survives the `| tee` below — without it a
          # FAIL/fail-closed verdict is masked by tee's 0 and the job goes green dishonestly.
          set -o pipefail
          cd cicd/tests
          JUDGE_FLAG=""
          case "${{ inputs.judge_mode || 'simple' }}" in
            dual) JUDGE_FLAG="--judge" ;;
            verify-live) JUDGE_FLAG="--verify-live --verify-allow ${{ inputs.verify_allow || 'list_projects' }} --verify-server-name ${{ inputs.verify_server_name || 'testlink' }}" ;;
          esac
          echo "Judge mode: ${{ inputs.judge_mode || 'simple' }}"
          BATCH_FLAG=""
          if [ -n "$NUM_BATCH" ]; then
            BATCH_FLAG="--num-batch $NUM_BATCH"
          fi
          echo "num_batch: ${NUM_BATCH:-default(512)}"

          # The subcommand prints a markdown summary to stdout (→ step summary)
          # and writes the JSON report to --output. Exit code gates the job.
          # shellcheck disable=SC2086 -- intentional word splitting on models + flag
          bash ../scripts/gpu-temp-guard.sh -- npx tsx src/cli.ts test-mcp $MODELS \
            --prompt "${{ inputs.prompt || 'List the projects.' }}" \
            --num-ctx "${{ inputs.num_ctx || '8192' }}" \
            --timeout "${{ inputs.timeout || '1800' }}" \
            --mcp-command "${{ inputs.mcp_command || 'docker' }}" \
            --mcp-args "${{ inputs.mcp_args || 'run --rm -i -e TESTLINK_URL -e TESTLINK_API_KEY dogkeeper886/testlink-mcp:latest' }}" \
            --mcp-env "TESTLINK_URL,TESTLINK_API_KEY" \
            --distractor-command "${{ inputs.distractor_command }}" \
            --distractor-args "${{ inputs.distractor_args }}" \
            --output /tmp/mcp-results.json \
            $BATCH_FLAG $JUDGE_FLAG | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Unload models
        if: always()
        env:
          MODELS: ${{ inputs.models }}
        run: |
          for MODEL in $MODELS; do
            curl -s "${OLLAMA_HOST}/api/generate" -d "{\"model\":\"${MODEL}\",\"keep_alive\":0}" || true
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-results
          path: /tmp/mcp-results.json
