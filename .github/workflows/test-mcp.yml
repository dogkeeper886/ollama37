name: MCP Tool-Call Test

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to test (space-separated)"
        required: true
        default: "gemma4:e4b"
        type: string
      prompt:
        description: "Prompt that should trigger a tool call"
        required: false
        default: "List the projects."
        type: string
      num_ctx:
        description: "Context window size"
        required: false
        default: "4096"
        type: string
      judge_mode:
        description: "Verification mode (simple = structural check; dual = also run the keyless agent judge for groundedness)"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
      mcp_command:
        description: "Command to launch the stdio MCP server"
        required: false
        default: "docker"
        type: string
      mcp_args:
        description: "Args for the MCP server (space-separated)"
        required: false
        default: "run --rm -i -e TESTLINK_URL -e TESTLINK_API_KEY dogkeeper886/testlink-mcp:latest"
        type: string

env:
  OLLAMA_HOST: http://localhost:11434

jobs:
  test-mcp:
    name: MCP Tool-Call Test
    runs-on: self-hosted
    environment: cicd-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          MODELS: ${{ inputs.models }}
        run: |
          # Only allow model name characters: alphanumeric, colon, dot, dash, underscore, slash, space
          if ! echo "$MODELS" | grep -qE '^[a-zA-Z0-9:._/ -]+$'; then
            echo "ERROR: Invalid characters in model names: $MODELS" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Run MCP tool-call test
        env:
          MODELS: ${{ inputs.models }}
          # Keyless agent judge auth (dual mode). Falls back to the runner's
          # ambient ~/.claude if the secret is unset.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # testlink-mcp creds. Forwarded to the spawned server via --mcp-env.
          # Without them the run degrades cleanly (errors / NO TOOL SUPPORT surfaced).
          TESTLINK_URL: ${{ secrets.TESTLINK_URL }}
          TESTLINK_API_KEY: ${{ secrets.TESTLINK_API_KEY }}
        run: |
          cd cicd/tests
          JUDGE_FLAG=""
          if [ "${{ inputs.judge_mode || 'simple' }}" = "dual" ]; then
            JUDGE_FLAG="--judge"
          fi
          echo "Judge mode: ${{ inputs.judge_mode || 'simple' }}"

          # The subcommand prints a markdown summary to stdout (→ step summary)
          # and writes the JSON report to --output. Exit code gates the job.
          # shellcheck disable=SC2086 -- intentional word splitting on models + flag
          npx tsx src/cli.ts test-mcp $MODELS \
            --prompt "${{ inputs.prompt || 'List the projects.' }}" \
            --num-ctx "${{ inputs.num_ctx || '4096' }}" \
            --mcp-command "${{ inputs.mcp_command || 'docker' }}" \
            --mcp-args "${{ inputs.mcp_args || 'run --rm -i -e TESTLINK_URL -e TESTLINK_API_KEY dogkeeper886/testlink-mcp:latest' }}" \
            --mcp-env "TESTLINK_URL,TESTLINK_API_KEY" \
            --output /tmp/mcp-results.json \
            $JUDGE_FLAG | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Unload models
        if: always()
        env:
          MODELS: ${{ inputs.models }}
        run: |
          for MODEL in $MODELS; do
            curl -s "${OLLAMA_HOST}/api/generate" -d "{\"model\":\"${MODEL}\",\"keep_alive\":0}" || true
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-results
          path: /tmp/mcp-results.json
