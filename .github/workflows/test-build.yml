name: Build Verification

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: "Run a single test by ID (e.g. TC-BUILD-002)"
        required: false
        type: string
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
    outputs:
      result:
        description: "Build test result"
        value: ${{ jobs.build.outputs.result }}

jobs:
  build:
    name: Build Verification
    runs-on: self-hosted
    environment: cicd-1
    env:
      OLLAMA_VERSION: ${{ vars.OLLAMA_VERSION || '0.0.0' }}
      OLLAMA37_ROOT: ${{ github.workspace }}
    outputs:
      result: ${{ steps.build-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Run build tests
        id: build-tests
        run: |
          cd cicd/tests

          echo "Ollama version: $OLLAMA_VERSION"

          # Build test ID flag if provided
          ID_FLAG=""
          if [ -n "${{ inputs.test_id }}" ]; then
            ID_FLAG="--id ${{ inputs.test_id }}"
            echo "Running single test: ${{ inputs.test_id }}"
          fi

          npx tsx src/cli.ts run --suite build $ID_FLAG --no-llm --format json > /tmp/build-results.json || true

          echo "--- JSON Results ---"
          cat /tmp/build-results.json

      - name: Check test results
        run: |
          FAILED=$(jq '.summary.failed' /tmp/build-results.json)
          echo "Failed tests: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED build test(s) failed"
            exit 1
          fi

      - name: Upload build results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-results
          path: |
            /tmp/build-results.json
            cicd/results/
