name: Deploy

# Bring the ollama37 container up on the current image and health-check it, then
# give the GPU back (#542). Shell, not a test: cicd/scripts/deploy.sh leaves a
# healthy server or fails the job, with every runtime check (CUDA detection, GPU
# count and names, /api/metrics consistency).

on:
  workflow_dispatch:
    inputs:
      restart:
        description: "docker compose down, then up, before the health checks"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Which GPU testbed. sm37 = Tesla K80 (reference). sm61 = GTX 1080 Ti, sm86 = RTX 3060."
        required: false
        default: "sm37"
        type: choice
        options: ["sm37", "sm61", "sm86"]
  workflow_call:
    inputs:
      restart: { required: false, default: false, type: boolean }
      runner_label: { required: false, default: "sm37", type: string }

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner_label || 'sm37' }}"]
    environment: cicd-1
    timeout-minutes: 30
    env:
      OLLAMA37_ROOT: ${{ github.workspace }}
      RESTART: ${{ inputs.restart && '--restart' || '' }}
      # On a host with no OLLAMA37_SERVICE, bring the container up rather than wait
      # on a server nobody started -- deploy is where the container is owned.
      OLLAMA37_COMPOSE_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/identify-host
      - name: Yield GPU
        run: cicd/scripts/gpu-yield.sh
      - name: Deploy and health-check
        run: cicd/scripts/deploy.sh $RESTART
      - name: Restore GPU
        if: always()
        run: cicd/scripts/gpu-restore.sh
