name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v2.0.3)"
        required: true
        type: string

env:
  DOCKERHUB_REPO: dogkeeper886/ollama37

jobs:
  publish:
    name: Build & Push Docker Image
    runs-on: [self-hosted, sm37]
    environment: cicd-1
    env:
      OLLAMA_VERSION: ${{ vars.OLLAMA_VERSION || '0.0.0' }}

    steps:
      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${OLLAMA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${OLLAMA_VERSION} (tag: ${TAG})"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      # Guarded: this job checks out an arbitrary release tag, and tags cut before the
      # action existed have no .github/actions/identify-host to resolve. Without the
      # guard, republishing any older release fails at this step.
      - name: Identify host
        if: hashFiles('.github/actions/identify-host/action.yml') != ''
        uses: ./.github/actions/identify-host

      - name: Build Docker image
        run: |
          cd docker
          OLLAMA_VERSION=${{ steps.version.outputs.version }} \
            make build-runtime-no-cache

      - name: Tag for Docker Hub
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          # Tag with version and latest
          docker tag ollama37:latest ${DOCKERHUB_REPO}:${TAG}
          docker tag ollama37:latest ${DOCKERHUB_REPO}:latest

          echo "Tagged:"
          echo "  ${DOCKERHUB_REPO}:${TAG}"
          echo "  ${DOCKERHUB_REPO}:latest"

      - name: Push to Docker Hub
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          docker push ${DOCKERHUB_REPO}:${TAG}
          docker push ${DOCKERHUB_REPO}:latest

          echo "Pushed:"
          echo "  ${DOCKERHUB_REPO}:${TAG}"
          echo "  ${DOCKERHUB_REPO}:latest"

      - name: Generate summary
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Docker Image Published

          **Version:** ${TAG}

          \`\`\`bash
          docker pull ${DOCKERHUB_REPO}:${TAG}
          docker pull ${DOCKERHUB_REPO}:latest
          \`\`\`
          EOF

      - name: Clean up local tags
        if: always()
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          docker rmi ${DOCKERHUB_REPO}:${TAG} 2>/dev/null || true
          docker rmi ${DOCKERHUB_REPO}:latest 2>/dev/null || true
