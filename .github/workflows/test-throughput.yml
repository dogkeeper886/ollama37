name: Throughput Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to benchmark (space-separated)"
        required: true
        default: "gemma3:4b"
        type: string
      num_predict:
        description: "Max tokens to generate"
        required: false
        default: "128"
        type: string
      context_size:
        description: "Context window size"
        required: false
        default: "2048"
        type: string
      judge_mode:
        description: "Output validation mode (simple = response non-empty; dual = also run the keyless agent judge for meaningfulness)"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
      runner_label:
        description: "Which GPU testbed to run on. sm37 = Tesla K80 (reference). sm75 = RTX 2060 (models must fit ~5.1 GiB)."
        required: false
        default: "sm37"
        type: choice
        options:
          - "sm37"
          - "sm75"
      flash_attention:
        description: "OLLAMA_FLASH_ATTENTION for this run: 0 = off (cuBLAS, the stable baseline), 1 = on (FA)."
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      kv_cache_type:
        description: "OLLAMA_KV_CACHE_TYPE (e.g. f16, q8_0). Empty = compose default (f16)."
        required: false
        default: ""
        type: string
      num_batch:
        description: "num_batch (micro-batch) per request. Empty = model default (512). Lower shrinks the Q·Kᵀ compute-graph reservation at long context."
        required: false
        default: ""
        type: string

env:
  OLLAMA_HOST: http://localhost:11434

jobs:
  throughput:
    name: Throughput Benchmark
    runs-on: [self-hosted, "${{ inputs.runner_label || 'sm37' }}"]
    environment: cicd-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify host
        uses: ./.github/actions/identify-host

      - name: Validate inputs
        env:
          MODELS: ${{ inputs.models }}
          NUM_BATCH: ${{ inputs.num_batch }}
        run: |
          # Only allow model name characters: alphanumeric, colon, dot, dash, underscore, slash, space
          if ! echo "$MODELS" | grep -qE '^[a-zA-Z0-9:._/ -]+$'; then
            echo "ERROR: Invalid characters in model names: $MODELS" >&2
            exit 1
          fi
          # num_batch, if given, must be a bare positive integer (it is spliced into a shell command).
          if [ -n "$NUM_BATCH" ] && ! echo "$NUM_BATCH" | grep -qE '^[1-9][0-9]*$'; then
            echo "ERROR: num_batch must be a positive integer, got: $NUM_BATCH" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      # Self-contained: apply the experiment env by recreating the container from the
      # current ollama37:latest. The always() revert step below restores the stable
      # baseline (FA off) even if the benchmark crashes — the testbed is never left in
      # an experimental state. Models live in the external ollama-data volume, so they
      # survive the recreate.
      - name: Apply experiment environment
        env:
          FA: ${{ inputs.flash_attention || '0' }}
          KV: ${{ inputs.kv_cache_type }}
        run: |
          cd docker
          echo "Applying experiment env: OLLAMA_FLASH_ATTENTION=${FA} OLLAMA_KV_CACHE_TYPE='${KV}'"
          OLLAMA_FLASH_ATTENTION="${FA}" OLLAMA_KV_CACHE_TYPE="${KV}" docker compose up -d --force-recreate
          for i in $(seq 1 60); do curl -sf "${OLLAMA_HOST}/api/tags" >/dev/null 2>&1 && break; sleep 2; done
          curl -sf "${OLLAMA_HOST}/api/tags" >/dev/null 2>&1 || { echo "server did not come up"; docker compose logs 2>&1 | tail -30; exit 1; }
          docker compose logs 2>&1 | grep -i "flash_attn" | tail -2 || true

      - name: Run throughput benchmark
        env:
          MODELS: ${{ inputs.models }}
          NUM_BATCH: ${{ inputs.num_batch }}
          # Keyless agent judge auth (dual mode). Falls back to the runner's
          # ambient ~/.claude if the secret is unset.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # pipefail so the runner's exit code survives the `| tee` below (else a FAIL is masked green).
          set -o pipefail
          cd cicd/tests
          JUDGE_FLAG=""
          if [ "${{ inputs.judge_mode || 'simple' }}" = "dual" ]; then
            JUDGE_FLAG="--judge"
          fi
          echo "Judge mode: ${{ inputs.judge_mode || 'simple' }}"
          BATCH_FLAG=""
          if [ -n "$NUM_BATCH" ]; then
            BATCH_FLAG="--num-batch $NUM_BATCH"
          fi
          echo "num_batch: ${NUM_BATCH:-default(512)}"

          # The subcommand prints a markdown summary to stdout (→ step summary)
          # and writes the JSON report to --output. Exit code gates the job.
          # shellcheck disable=SC2086 -- intentional word splitting on models + flag
          bash ../scripts/gpu-temp-guard.sh -- npx tsx src/cli.ts bench-throughput $MODELS \
            --num-predict "${{ inputs.num_predict || '128' }}" \
            --context "${{ inputs.context_size || '2048' }}" \
            --output /tmp/throughput-results.json \
            $BATCH_FLAG $JUDGE_FLAG | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Unload models
        if: always()
        env:
          MODELS: ${{ inputs.models }}
        run: |
          for MODEL in $MODELS; do
            curl -s "${OLLAMA_HOST}/api/generate" -d "{\"model\":\"${MODEL}\",\"keep_alive\":0}" || true
          done

      # Guaranteed revert: restore the stable baseline (FA off) whatever happened above —
      # a benchmark crash/panic still leaves the testbed in a known-good state.
      - name: Revert to stable baseline (FA off)
        if: always()
        run: |
          cd docker
          echo "Reverting testbed to stable baseline: OLLAMA_FLASH_ATTENTION=0"
          OLLAMA_FLASH_ATTENTION=0 docker compose up -d --force-recreate
          for i in $(seq 1 60); do curl -sf "${OLLAMA_HOST}/api/tags" >/dev/null 2>&1 && break; sleep 2; done
          echo "Baseline restored (FA off)."

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: throughput-results
          path: /tmp/throughput-results.json
