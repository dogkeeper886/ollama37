name: Full Test Pipeline

on:
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Test judge mode"
        required: false
        default: "dual"
        type: choice
        options:
          - "simple"
          - "dual"
      judge_model:
        description: "LLM model for judging (if dual mode)"
        required: false
        default: "gemma3:12b-judge"
        type: string
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-build.yml
    with:
      debug: ${{ inputs.debug }}

  runtime:
    name: Runtime Tests
    needs: build
    uses: ./.github/workflows/test-runtime.yml
    with:
      debug: ${{ inputs.debug }}

  inference:
    name: Inference Tests
    needs: runtime
    uses: ./.github/workflows/test-inference.yml
    with:
      judge_mode: ${{ inputs.judge_mode }}
      judge_model: ${{ inputs.judge_model }}
      debug: ${{ inputs.debug }}

  models:
    name: Models Tests
    needs: inference
    uses: ./.github/workflows/test-models.yml
    with:
      judge_mode: ${{ inputs.judge_mode }}
      judge_model: ${{ inputs.judge_model }}
      debug: ${{ inputs.debug }}
