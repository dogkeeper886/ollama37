name: Full Test Pipeline

# Every ported suite, one job each, in the order a build is validated: build the
# image, bring the container up on it, then ask it for language. A job runs only
# when the one before it passed.
#
# No judge input: the v2 suites assert deterministically (#535). The two gates
# default on here, and only here — the pipeline is the full validation, and the
# old one compiled the image (TC-BUILD-002) and restarted the container
# (TC-RUNTIME-001) on every run.

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build the runtime image from source in the build suite (an hour of nvcc), then retag it"
        required: false
        default: true
        type: boolean
      restart_container:
        description: "Let the runtime suite run `docker compose down` and `up` on the new image"
        required: false
        default: true
        type: boolean
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Which GPU testbed to run on. sm37 = Tesla K80 (full validation runs here). sm61 = GTX 1080 Ti, sm86 = RTX 3060 (one card each, set up for the models suite)."
        required: false
        default: "sm37"
        type: choice
        options:
          - "sm37"
          - "sm61"
          - "sm86"

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-suites-v2.yml
    with:
      suite: suites/build.test.ts
      build_image: ${{ inputs.build_image }}
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  runtime:
    name: Runtime Tests
    needs: build
    uses: ./.github/workflows/test-suites-v2.yml
    with:
      suite: suites/runtime.test.ts
      restart_container: ${{ inputs.restart_container }}
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  inference:
    name: Inference Tests
    needs: runtime
    uses: ./.github/workflows/test-suites-v2.yml
    with:
      suite: suites/inference.test.ts
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  models:
    name: Models Tests
    needs: inference
    uses: ./.github/workflows/test-suites-v2.yml
    with:
      suite: suites/models.test.ts
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}
