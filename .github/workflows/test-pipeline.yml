name: Full Test Pipeline

on:
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Test judge mode for inference + models (dual = SimpleJudge plus the keyless agent judge; simple = SimpleJudge only)"
        required: false
        default: "dual"
        type: choice
        options:
          - "dual"
          - "simple"
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Which GPU testbed to run on. sm37 = Tesla K80 (full validation runs here). sm61 = GTX 1080 Ti, sm86 = RTX 3060 (one card each, set up for the models suite)."
        required: false
        default: "sm37"
        type: choice
        options:
          - "sm37"
          - "sm61"
          - "sm86"

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-build.yml
    with:
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  runtime:
    name: Runtime Tests
    needs: build
    uses: ./.github/workflows/test-runtime.yml
    with:
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  inference:
    name: Inference Tests
    needs: runtime
    uses: ./.github/workflows/test-inference.yml
    # Pass CLAUDE_CODE_OAUTH_TOKEN down to the keyless agent judge (dual mode).
    secrets: inherit
    with:
      judge_mode: ${{ inputs.judge_mode }}
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  models:
    name: Models Tests
    needs: inference
    uses: ./.github/workflows/test-models.yml
    secrets: inherit
    with:
      judge_mode: ${{ inputs.judge_mode }}
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}
