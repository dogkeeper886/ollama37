name: Full Test Pipeline

on:
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Test judge mode for inference + models (simple = SimpleJudge only; dual = also run the keyless agent judge)"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Which GPU testbed to run on. sm37 = Tesla K80 (full validation runs here). sm75 = RTX 2060 — completes build+runtime only; inference (#385) and models (VRAM) do not run there yet."
        required: false
        default: "sm37"
        type: choice
        options:
          - "sm37"
          - "sm75"

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-build.yml
    with:
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  runtime:
    name: Runtime Tests
    needs: build
    uses: ./.github/workflows/test-runtime.yml
    with:
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  inference:
    name: Inference Tests
    needs: runtime
    uses: ./.github/workflows/test-inference.yml
    # Pass CLAUDE_CODE_OAUTH_TOKEN down to the keyless agent judge (dual mode).
    secrets: inherit
    with:
      judge_mode: ${{ inputs.judge_mode }}
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}

  models:
    name: Models Tests
    needs: inference
    uses: ./.github/workflows/test-models.yml
    secrets: inherit
    with:
      judge_mode: ${{ inputs.judge_mode }}
      debug: ${{ inputs.debug }}
      runner_label: ${{ inputs.runner_label }}
