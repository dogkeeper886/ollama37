name: CI Image

# Moves one build artifact between two independent testbeds that cannot reach each other.
#
#   sm37:  publish  → docker tag ollama37:latest → push  ci-<sha>  → emit digest
#   sm37:  fetch    ← docker pull <digest> → retag ollama37:latest
#   sm75:  fetch    ← docker pull <digest> → retag ollama37:latest
#
# Both testbeds fetch the same digest, so "sm37 says no-harm" and "sm75 says fixed"
# provably describe the same bits. A tag can be overwritten; a digest cannot.
#
# No secret and no `docker login` step: the sm37 daemon holds a credential from a
# one-time login (release-docker.yml pushes the same way), and the CI repo is public
# so any host pulls anonymously.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish = tag+push the locally built image. fetch = pull a digest and retag it locally."
        required: true
        type: choice
        options:
          - "fetch"
          - "publish"
      runner_label:
        description: "Which GPU testbed to run on."
        required: true
        default: "sm37"
        type: choice
        options:
          - "sm37"
          - "sm75"
      reference:
        description: "fetch: the digest to pull (sha256:...). publish: ignored."
        required: false
        type: string
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      runner_label:
        required: false
        default: "sm37"
        type: string
      reference:
        required: false
        type: string
    outputs:
      digest:
        description: "Fully qualified digest of the published image (publish mode only)"
        value: ${{ jobs.image.outputs.digest }}

env:
  # The CI image lives in its own repo so half-tested ci-<sha> tags never clutter the
  # tag list users pull `:latest` from. Public, so any runner pulls without auth.
  CI_IMAGE_REPO: dogkeeper886/ollama37-ci
  # What docker/docker-compose.yml expects to find locally.
  LOCAL_TAG: ollama37:latest

jobs:
  image:
    name: CI Image (${{ inputs.mode }} on ${{ inputs.runner_label }})
    runs-on: [self-hosted, "${{ inputs.runner_label || 'sm37' }}"]
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify host
        uses: ./.github/actions/identify-host

      - name: Publish
        id: publish
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:12}"
          REF="${CI_IMAGE_REPO}:ci-${SHA}"

          # The image must already exist locally. test-build.yml (TC-BUILD-002) builds it.
          if ! docker image inspect "${LOCAL_TAG}" >/dev/null 2>&1; then
            echo "::error::${LOCAL_TAG} not present. Run test-build.yml on this runner first."
            exit 1
          fi

          docker tag "${LOCAL_TAG}" "${REF}"
          docker push "${REF}"

          # RepoDigests is only populated after a successful push.
          DIGEST="$(docker image inspect "${REF}" --format '{{index .RepoDigests 0}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          {
            echo "### CI image published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${REF}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo
            echo "Fetch it on the other testbed:"
            echo '```'
            echo "gh workflow run ci-image.yml -f mode=fetch -f runner_label=sm75 -f reference='${DIGEST}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch
        if: inputs.mode == 'fetch'
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.reference }}"
          if [ -z "${REF}" ]; then
            echo "::error::fetch mode requires 'reference' (a digest, e.g. ${CI_IMAGE_REPO}@sha256:...)"
            exit 1
          fi
          # Refuse a bare tag: a tag can be overwritten, so it cannot prove two hosts
          # ran the same bits. That guarantee is the entire reason this workflow exists.
          case "${REF}" in
            *@sha256:*) ;;
            *) echo "::error::'reference' must be a digest (…@sha256:…), not a tag: ${REF}"; exit 1 ;;
          esac

          docker pull "${REF}"
          docker tag "${REF}" "${LOCAL_TAG}"

          {
            echo "### CI image fetched"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`${REF}\` |"
            echo "| Retagged as | \`${LOCAL_TAG}\` |"
            echo
            echo "\`docker/docker-compose.yml\` reads \`${LOCAL_TAG}\`, so the suites now run this artifact."
          } >> "$GITHUB_STEP_SUMMARY"
