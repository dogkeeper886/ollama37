name: Setup (build + deploy)

# Setup, not tests (#542): leaves a usable image and a healthy container, or fails.
# The logic is in cicd/scripts; this file only wires it.

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build the runtime image from source (about an hour of nvcc) and retag it"
        required: false
        default: false
        type: boolean
      restart:
        description: "docker compose down, then up, before the health checks"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Which GPU testbed. sm37 = Tesla K80 (reference). sm61 = GTX 1080 Ti, sm86 = RTX 3060 (one card each)."
        required: false
        default: "sm37"
        type: choice
        options: ["sm37", "sm61", "sm86"]
  workflow_call:
    inputs:
      build_image: { required: false, default: false, type: boolean }
      restart: { required: false, default: false, type: boolean }
      runner_label:
        required: false
        default: "sm37"
        type: string

jobs:
  setup:
    runs-on: [self-hosted, "${{ inputs.runner_label || 'sm37' }}"]
    environment: cicd-1
    timeout-minutes: 120
    env:
      OLLAMA37_ROOT: ${{ github.workspace }}
      OLLAMA_VERSION: ${{ vars.OLLAMA_VERSION }}
      BUILD: ${{ inputs.build_image && '--build' || '' }}
      RESTART: ${{ inputs.restart && '--restart' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/identify-host
      - name: Build image
        run: cicd/scripts/build-image.sh $BUILD
      - name: Yield GPU
        run: cicd/scripts/gpu-yield.sh
      - name: Deploy and health-check
        run: cicd/scripts/deploy.sh $RESTART
      - name: Restore GPU
        if: always()
        run: cicd/scripts/gpu-restore.sh
