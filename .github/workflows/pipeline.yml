name: Build + Test Pipeline

# Build the image, deploy it, prove the judge still catches garbage, then test
# every model (#542). Each job runs only when the one before it passed, so a broken
# image is never tested and a broken judge never grades a run. Throughput and MCP
# run on their own (test-throughput.yml, test-mcp.yml).

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: "Compile the runtime image from source (about 25 minutes on sm37) and retag it"
        required: false
        default: true
        type: boolean
      restart:
        description: "Recreate the container on the image before the health checks"
        required: false
        default: true
        type: boolean
      runner_label:
        description: "Which GPU testbed. sm37 = Tesla K80 (full validation)."
        required: false
        default: "sm37"
        type: choice
        options: ["sm37", "sm61", "sm86"]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      build_image: ${{ inputs.build_image }}
      runner_label: ${{ inputs.runner_label }}
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      restart: ${{ inputs.restart }}
      runner_label: ${{ inputs.runner_label }}
  canary:
    needs: deploy
    uses: ./.github/workflows/test-canary.yml
    secrets: inherit
    with:
      runner_label: ${{ inputs.runner_label }}
  models:
    needs: canary
    uses: ./.github/workflows/test-models.yml
    secrets: inherit
    with:
      runner_label: ${{ inputs.runner_label }}
