name: Inference Tests

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: "Run a single test by ID (e.g. TC-INFERENCE-001)"
        required: false
        type: string
      judge_mode:
        description: "Test judge mode (simple = SimpleJudge only; dual = also run the keyless agent judge)"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      judge_mode:
        description: "Test judge mode (simple, dual)"
        required: false
        default: "simple"
        type: string
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
    outputs:
      result:
        description: "Inference test result"
        value: ${{ jobs.inference.outputs.result }}

env:
  OLLAMA_HOST: http://localhost:11434

jobs:
  inference:
    name: Inference Tests
    runs-on: self-hosted
    environment: cicd-1
    env:
      OLLAMA37_ROOT: ${{ github.workspace }}
      OLLAMA_DEBUG: ${{ inputs.debug && '1' || '' }}
    outputs:
      result: ${{ steps.inference-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Run inference tests
        id: inference-tests
        env:
          # dual mode runs the keyless agent judge; the runner reads JUDGE_MODE.
          JUDGE_MODE: ${{ inputs.judge_mode || 'simple' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd cicd/tests
          echo "Judge mode: ${JUDGE_MODE}"

          # Build test ID flag if provided
          ID_FLAG=""
          if [ -n "${{ inputs.test_id }}" ]; then
            ID_FLAG="--id ${{ inputs.test_id }}"
            echo "Running single test: ${{ inputs.test_id }}"
          fi

          npx tsx src/cli.ts run --suite inference $ID_FLAG --format json > /tmp/inference-results.json || true

          echo "--- JSON Results ---"
          cat /tmp/inference-results.json

      - name: Check test results
        run: |
          FAILED=$(jq '.summary.failed' /tmp/inference-results.json)
          echo "Failed tests: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED inference test(s) failed"
            exit 1
          fi

      - name: Unload test models from VRAM
        if: always()
        run: |
          echo "Unloading test models from VRAM..."
          curl -s http://localhost:11434/api/generate -d '{"model":"gemma3:4b","keep_alive":0}' || true
          echo "Models unloaded"

      - name: Upload inference results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-test-results
          path: |
            /tmp/inference-results.json
            cicd/results/
