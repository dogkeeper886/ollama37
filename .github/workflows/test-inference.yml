name: Inference Tests

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: "Run a single test by ID (e.g. TC-INFERENCE-001)"
        required: false
        type: string
      model:
        description: "Model to pull and test (TEST_MODEL). Default gemma3:4b."
        required: false
        default: "gemma3:4b"
        type: string
      judge_mode:
        description: "Test judge mode (dual = SimpleJudge plus the keyless agent judge; simple = SimpleJudge only)"
        required: false
        default: "dual"
        type: choice
        options:
          - "dual"
          - "simple"
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Which GPU testbed to run on. sm37 = Tesla K80 (reference). sm61 = GTX 1080 Ti. sm86 = RTX 3060."
        required: false
        default: "sm37"
        type: choice
        options:
          - "sm37"
          - "sm61"
          - "sm86"
  workflow_call:
    inputs:
      model:
        description: "Model to pull and test (TEST_MODEL)"
        required: false
        default: "gemma3:4b"
        type: string
      judge_mode:
        description: "Test judge mode (simple, dual)"
        required: false
        default: "dual"
        type: string
      debug:
        description: "Enable OLLAMA_DEBUG=1 in container"
        required: false
        default: false
        type: boolean
      runner_label:
        description: "Which GPU testbed to run on"
        required: false
        default: "sm37"
        type: string
    outputs:
      result:
        description: "Inference test result"
        value: ${{ jobs.inference.outputs.result }}

jobs:
  inference:
    name: Inference Tests
    runs-on: [self-hosted, "${{ inputs.runner_label || 'sm37' }}"]
    environment: cicd-1
    env:
      OLLAMA37_ROOT: ${{ github.workspace }}
      OLLAMA_DEBUG: ${{ inputs.debug && '1' || '' }}
    outputs:
      result: ${{ steps.inference-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify host
        uses: ./.github/actions/identify-host

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Yield GPU
        uses: ./.github/actions/yield-gpu

      - name: Run inference tests
        id: inference-tests
        env:
          # Execute only. The agent judge runs after Restore GPU hands the card back.
          JUDGE_MODE: simple
          # inference testcases read TEST_MODEL (they default to gemma3:4b in-shell).
          TEST_MODEL: ${{ inputs.model || 'gemma3:4b' }}
        run: |
          cd cicd/tests
          echo "Judge mode: ${JUDGE_MODE}"

          # Build test ID flag if provided
          ID_FLAG=""
          if [ -n "${{ inputs.test_id }}" ]; then
            ID_FLAG="--id ${{ inputs.test_id }}"
            echo "Running single test: ${{ inputs.test_id }}"
          fi

          rc=0
          # --output-dir: any path, same in the Agent judge step
          bash ../scripts/gpu-temp-guard.sh -- npx tsx src/cli.ts run --suite inference $ID_FLAG --output-dir ../results/inference --format json > /tmp/inference-results.json || rc=$?
          [ "$rc" -eq 75 ] && exit 1   # overheat → fail the job; any other non-zero stays tolerated (gated by the JSON below)

          echo "--- JSON Results ---"
          cat /tmp/inference-results.json

      - name: Unload test models from VRAM
        if: always()
        env:
          TEST_MODEL: ${{ inputs.model || 'gemma3:4b' }}
        run: |
          echo "Unloading test models from VRAM..."
          curl -s ${OLLAMA_HOST:-http://localhost:11434}/api/generate -d "{\"model\":\"${TEST_MODEL}\",\"keep_alive\":0}" || true
          echo "Models unloaded"

      - name: Restore GPU
        if: always()
        uses: ./.github/actions/restore-gpu

      - name: Agent judge
        if: ${{ !cancelled() && (inputs.judge_mode || 'dual') == 'dual' }}
        env:
          JUDGE_MODE: dual
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # JUDGE_BASE_URL (cicd-1 variable) points the judge at an ollama server
          # instead of Anthropic — a judge off the box under test. Unset it and
          # the judge falls back to Claude on the OAuth token above; the auth
          # token has to follow the base URL or it would break that fallback.
          ANTHROPIC_BASE_URL: ${{ vars.JUDGE_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ vars.JUDGE_BASE_URL && 'ollama' || '' }}
          ANTHROPIC_MODEL: ${{ vars.JUDGE_BASE_URL && vars.JUDGE_MODEL || '' }}
          # Claude Code's side-call model; ollama has no haiku tag to serve it.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.JUDGE_BASE_URL && vars.JUDGE_MODEL || '' }}
        run: |
          cd cicd/tests
          # the Run inference tests step's --output-dir
          npx tsx src/cli.ts judge ../results/inference --format json > /tmp/inference-results.json || true
          cat /tmp/inference-results.json

      - name: Check test results
        run: |
          FAILED=$(jq '.summary.failed' /tmp/inference-results.json)
          echo "Failed tests: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED inference test(s) failed"
            exit 1
          fi

      - name: Upload inference results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-test-results
          path: |
            /tmp/inference-results.json
            cicd/results/
