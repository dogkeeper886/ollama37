name: Models

# each model loads, answers in language, and uses the GPU as it should; one model is an inference test (#542).
# Wiring only: the test is cicd/tests/models.ts, which yields the GPU, runs, judges
# every reply on the pinned judge, gives the GPU back and fails on anything unjudged.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated models (empty = the runner's .env list)"
        required: false
        type: string

      runner_label:
        description: "Which GPU testbed. sm37 = Tesla K80 (reference). sm61 = GTX 1080 Ti, sm86 = RTX 3060 (one card each)."
        required: false
        default: "sm37"
        type: choice
        options: ["sm37", "sm61", "sm86"]
  workflow_call:
    inputs:
      models: { required: false, type: string }

      runner_label:
        required: false
        default: "sm37"
        type: string

jobs:
  models:
    runs-on: [self-hosted, "${{ inputs.runner_label || 'sm37' }}"]
    environment: cicd-1
    timeout-minutes: 660
    env:
      OLLAMA37_ROOT: ${{ github.workspace }}
      MODELS: ${{ inputs.models }}

      # The judge: the pinned v2.3.4 server cicd/scripts/judge-up.sh starts (#597).
      JUDGE_BASE_URL: http://localhost:11435
      JUDGE_MODEL: ornith-1.5:9b
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/identify-host
      - uses: ./.github/actions/setup-tests
      - name: Run
        working-directory: cicd/tests
        run: npx tsx models.ts ${MODELS:+--models "$MODELS"} --output results/models.json
      # runTest removes the judge and restores the GPU itself, but a cancelled or
      # timed-out job kills it first; these two clean up whatever happened above.
      - name: Stop judge
        if: always()
        run: cicd/scripts/judge-down.sh
      - name: Restore GPU
        if: always()
        run: cicd/scripts/gpu-restore.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: models-report
          path: cicd/tests/results/models.json
          if-no-files-found: warn
