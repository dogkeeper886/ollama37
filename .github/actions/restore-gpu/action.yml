name: Restore GPU
description: >
  Give the GPU back and wait for the restored server to answer. Stops
  OLLAMA37_SERVICE and starts OLLAMA37_YIELD_SERVICE again, but only where the host
  named both and left the yielded one enabled. A host that names neither is untouched.

  Call it from a step carrying `if: always()`, so a crashed benchmark still returns
  the card.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        [ -n "${OLLAMA37_SERVICE:-}" ] || exit 0
        systemctl --user stop "$OLLAMA37_SERVICE"
        [ -n "${OLLAMA37_YIELD_SERVICE:-}" ] || exit 0
        # enabled, not "was running": a job killed mid-run then heals on the next one.
        systemctl --user is-enabled --quiet "$OLLAMA37_YIELD_SERVICE" || exit 0
        systemctl --user start "$OLLAMA37_YIELD_SERVICE"
        # integer >= 1 tries, 2 s apart
        for i in $(seq 1 60); do curl -sf "${OLLAMA_HOST:-http://localhost:11434}/api/tags" >/dev/null && exit 0; sleep 2; done
        echo "::error::$OLLAMA37_YIELD_SERVICE did not come back"; exit 1
