id: TC-RUNTIME-002
name: GPU Detection
suite: runtime
priority: 2
timeout: 120000
dependencies:
  - TC-RUNTIME-001
intent:
  user_story: |
    Verify the GPU is detected by nvidia-smi and the Ollama CUDA runtime.
  notes: |
    Host-agnostic: runs on any GPU testbed (sm37 = Tesla K80, sm75 = RTX 2060, …).
    Asserts the property "a CUDA GPU is present and in use", not a specific card,
    driver, or compute capability — the identify-host action records those per run.

steps:
  - name: Check nvidia-smi inside container
    command: docker exec ollama37 nvidia-smi
    expectPatterns:
      - "CUDA Version"
    rejectPatterns:
      - "NVIDIA-SMI has failed"
      - "No devices were found"

  - name: Check CUDA libraries
    command: docker exec ollama37 ldconfig -p | grep -i cuda | head -5
    expectPatterns:
      - "cuda"

  - name: Ensure UVM device exists
    command: |
      if [ ! -e /dev/nvidia-uvm ]; then
        echo "Creating UVM device..."
        sudo nvidia-modprobe -u -c=0 || true
      fi
      ls -la /dev/nvidia-uvm 2>/dev/null && echo "UVM device exists" || echo "UVM device not found"
    expectPatterns:
      - "nvidia-uvm"

  - name: Check Ollama GPU detection in logs
    command: docker compose -f ${OLLAMA37_ROOT}/docker/docker-compose.yml logs 2>&1 | grep -i "inference compute" | tail -5
    expectPatterns:
      - "library=CUDA"
      - "compute=[0-9]+\\.[0-9]+"
    rejectPatterns:
      - "library=cpu"

criteria: |
  Verify the GPU is detected by both nvidia-smi AND the Ollama CUDA runtime.

  nvidia-smi should report a working driver stack (a "CUDA Version" line) and must
  NOT show "NVIDIA-SMI has failed" or "No devices were found".

  Ollama logs should show:
  - library=CUDA (NOT library=cpu)
  - compute=X.Y (a real compute capability — 3.7 on the K80, 7.5 on the RTX 2060, etc.)

  If logs show "library=cpu", GPU detection has failed.
