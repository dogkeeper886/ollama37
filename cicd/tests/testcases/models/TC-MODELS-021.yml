id: TC-MODELS-021
name: "lfm2.5-thinking:1.2b Inference"
suite: models
priority: 2
timeout: 600000
dependencies: []
issue: "438"
intent:
  user_story: |
    Validate lfm2.5-thinking:1.2b (Liquid LFM2, thinking, ~0.7 GB) runs on K80 compute 3.7
    (single GPU). The ollama-library GGUF is mis-converted — feed_forward_length metadata
    (12288) disagrees with its 8192-wide FFN tensors, and its final norm ships as output_norm
    (no token_embd_norm); patch 0034 loads it by deriving n_ff from the ffn_gate tensor and
    resolving tok_norm from output_norm. "think": false pinned so the answer isn't buried in a
    <think> span.
  notes: |
    Prerequisite: lfm2.5-thinking:1.2b pre-pulled on the runner.
    Acceptable warning (NOT an error): "flash attention enabled but not supported by gpu".

steps:
  - name: Test inference
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"lfm2.5-thinking:1.2b","prompt":"What is 2+2? Answer briefly.","stream":false,"think":false,"options":{"num_predict":200}}' \
        | head -c 2000
    expectPatterns:
      - "response"
    rejectPatterns:
      - "CUBLAS_STATUS"
      - "CUDA error"
      - "missing tensor"
      - "wrong shape"

  - name: Check GPU memory
    command: docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv
    expectPatterns:
      - "[0-9]+ MiB"

  - name: Check GPU count
    command: |
      output=$(docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader)
      echo "$output"
      active=$(echo "$output" | grep -c 'MiB')
      total=$(echo "$output" | grep -oP '[0-9]+(?= MiB)' | paste -sd+ | bc)
      echo "Active GPUs: $active, Total VRAM: ${total} MiB"
      if [ "$active" -le 1 ]; then
        echo "GPU_COUNT_OK"
      elif [ "$total" -le $(( (active - 1) * 11441 )) ]; then
        echo "GPU_COUNT_EXCEEDED: total ${total} MiB fits in $((active - 1)) GPUs but using $active"
      else
        echo "GPU_COUNT_OK"
      fi
    expectPatterns:
      - "GPU_COUNT_OK"
    rejectPatterns:
      - "GPU_COUNT_EXCEEDED"

  - name: Unload model
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"lfm2.5-thinking:1.2b","keep_alive":0}'
      echo "Model unloaded"
    expectPatterns:
      - "Model unloaded"

criteria: |
  Validate lfm2.5-thinking:1.2b (Liquid LFM2 thinking, ~0.7 GB) runs on K80 (compute 3.7),
  single die. Prerequisite: pre-pulled. Loads via patch 0034 (#438) — feed_forward_length
  corrected from the ffn_gate tensor width, final norm resolved from output_norm; no
  "wrong shape" or "missing tensor" load failure.
