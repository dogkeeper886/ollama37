id: TC-MODELS-002
name: gemma3:27b Inference
suite: models
priority: 2
timeout: 900000
dependencies: []
intent:
  user_story: |
    Verify gemma3:27b answers on the K80

steps:
  - name: Test inference
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"gemma3:27b","prompt":"What is 2+2? Answer briefly.","stream":false,"options":{"num_predict":400,"temperature":0,"seed":0}}' \
        | head -c 2000
    expectPatterns:
      - '"response":"[^"]*4'
    rejectPatterns:
      - "CUBLAS_STATUS"
      - "CUDA error"

  - name: Check GPU memory
    command: docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv
    expectPatterns:
      - "[0-9]+ MiB"

  - name: Check GPU count
    command: |
      output=$(docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader)
      echo "$output"
      active=$(echo "$output" | grep -c 'MiB')
      total=$(echo "$output" | grep -oP '[0-9]+(?= MiB)' | paste -sd+ | bc)
      echo "Active GPUs: $active, Total VRAM: ${total} MiB"
      if [ "$active" -le 1 ]; then
        echo "GPU_COUNT_OK"
      elif [ "$total" -le $(( (active - 1) * 11441 )) ]; then
        echo "GPU_COUNT_EXCEEDED: total ${total} MiB fits in $((active - 1)) GPUs but using $active"
      else
        echo "GPU_COUNT_OK"
      fi
    expectPatterns:
      - "GPU_COUNT_OK"
    rejectPatterns:
      - "GPU_COUNT_EXCEEDED"

  - name: Unload model
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"gemma3:27b","keep_alive":0}'
      echo "Model unloaded"
    expectPatterns:
      - "Model unloaded"

criteria: |
  Verify gemma3:27b answers on the K80 and gives its dies back:
  - Answer contains a 4 (api/generate shows "response":"[^"]*4")
  - Weights are resident on the GPU (nvidia-smi shows "<N> MiB")
  - No more dies than the footprint needs (the die check shows "GPU_COUNT_OK")
  - Model unloads (api/generate with keep_alive 0 shows "Model unloaded")
