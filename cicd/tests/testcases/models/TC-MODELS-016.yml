id: TC-MODELS-016
name: gemma4:12b Multimodal Inference
suite: models
priority: 4
timeout: 1200000
dependencies: []
issue: 367
intent:
  user_story: |
    Validate gemma4:12b runs TEXT + VISION + AUDIO on K80 compute 3.7 via the legacy
    llama.cpp/clip path (split-vision model: separate mmproj projector blob). This is the
    acceptance for the #367 port: gemma4 arch + GPU offload fix + the gemma4uv vision
    embedder + the encoder-free gemma4ua audio path.
  acceptance:
    - Text: /api/generate returns coherent text (no garbage), no CUDA/CUBLAS errors
    - GPU: weights offloaded to GPU (not CPU) — the graph-size estimate fix
    - Vision: /api/chat with an image returns a non-empty description (no error)
    - Audio: /api/chat with a spoken-word WAV returns the recognized word
    - Model unloads cleanly
  notes: |
    Prerequisite: gemma4:12b pre-pulled on the runner. Audio rides the existing `images`
    field (mtmd auto-detects WAV). Fixtures are generated inline (python + espeak-ng).
    Acceptable warning (NOT an error): "flash attention enabled but not supported by gpu".

steps:
  - name: Text inference
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"gemma4:12b","prompt":"What is 2+2? Answer briefly.","stream":false,"options":{"num_predict":64}}' \
        | head -c 2000
    expectPatterns:
      - "response"
    rejectPatterns:
      - "CUBLAS_STATUS"
      - "CUDA error"

  - name: GPU offload check (must be on GPU, not CPU)
    command: docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv
    expectPatterns:
      - "[0-9]+ MiB"

  - name: Vision inference
    command: |
      IMG=$(python3 - <<'PY'
      import base64, struct, zlib
      # 224x224 RGB: white disc on black (a simple, describable shape)
      w=h=224; px=bytearray()
      for y in range(h):
          px.append(0)  # PNG filter byte per row
          for x in range(w):
              d=((x-112)**2+(y-112)**2)**0.5
              v=255 if d<70 else 0
              px += bytes((v,v,v))
      def chunk(t,d):
          c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
      png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(px)))+chunk(b'IEND',b'')
      print(base64.b64encode(png).decode())
      PY
      )
      curl -s http://localhost:11434/api/chat \
        -d "{\"model\":\"gemma4:12b\",\"messages\":[{\"role\":\"user\",\"content\":\"What shape is in this image? Answer in one short sentence.\",\"images\":[\"$IMG\"]}],\"stream\":false,\"think\":false,\"options\":{\"num_predict\":64}}" \
        | head -c 2000
    expectPatterns:
      # the model perceives the white disc — any of these confirms vision works
      - "circle|disc|round|white|shape|oval|dot|sphere|black"
    rejectPatterns:
      - "CUBLAS_STATUS"
      - "CUDA error"
      - "does not support"
      - "cannot see|can't see|unable to see|no image"

  - name: Audio inference (spoken word)
    command: |
      espeak-ng -s 130 -w /tmp/tc016_audio.wav "hello hello hello" 2>/dev/null
      python3 -c "import base64,json; b=base64.b64encode(open('/tmp/tc016_audio.wav','rb').read()).decode(); json.dump({'model':'gemma4:12b','messages':[{'role':'user','content':'Is a single word repeated in this audio? Answer in one short sentence.','images':[b]}],'stream':False,'think':False,'options':{'num_predict':64}}, open('/tmp/tc016_req.json','w'))"
      curl -s http://localhost:11434/api/chat -d @/tmp/tc016_req.json | head -c 2000
    expectPatterns:
      # the model perceives + engages with the audio (transcription accuracy is a quality
      # metric, not a load gate — encoder-free fidelity is marginal on synthetic speech)
      - "word|repeat|audio|sound|three|times|phrase|hello|spoken"
    rejectPatterns:
      - "CUBLAS_STATUS"
      - "CUDA error"
      - "does not support audio"
      - "cannot hear|can't hear|text-based|text-only|no audio|don't have the ability"

  - name: Unload model
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"gemma4:12b","keep_alive":0}'
      echo "Model unloaded"
    expectPatterns:
      - "Model unloaded"

criteria: |
  Validate gemma4:12b (~10 GB, text+vision+audio) runs on K80 (compute 3.7) via the legacy
  llama.cpp / clip path — the #367 acceptance.

  Expected:
  - Text: /api/generate returns JSON with "response" (coherent), no CUDA/CUBLAS errors
  - GPU: nvidia-smi shows the model resident in GPU memory (the graph-size fix offloads it;
    before the fix it ran on CPU)
  - Vision: /api/chat with an image returns "content" (a description; the gemma4uv embedder +
    <|image> markers + non-causal attention), no "does not support" error
  - Audio: /api/chat with espeak "hello x3" returns "hello" (the encoder-free gemma4ua path +
    <|audio> markers); no "does not support audio" error
  - Model unloads successfully

  Acceptable warnings (NOT errors):
  - "flash attention enabled but not supported by gpu" - normal K80 fallback
  - "audio input is in experimental stage" - expected for the audio path
