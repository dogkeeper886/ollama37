id: TC-MODELS-005
name: FunctionGemma Tool Calling
suite: models
priority: 4
timeout: 600000
dependencies: []
testlink_id: ollama37-26
issue: 39
intent:
  user_story: |
    Validate FunctionGemma generates valid tool calls on K80 compute 3.7

steps:
  - name: Test tool calling via chat API
    command: |
      curl -s http://localhost:11434/api/chat \
        -d '{
          "model":"functiongemma:270m",
          "messages":[{"role":"user","content":"What is the weather in San Francisco?"}],
          "tools":[{"type":"function","function":{"name":"get_weather","description":"Get the current weather in a given location","parameters":{"type":"object","required":["location"],"properties":{"location":{"type":"string","description":"The city and state"}}}}}],
          "stream":false,
          "options":{"temperature":0,"num_predict":200}
        }' | head -c 4000
    expectPatterns:
      - "get_weather"
      - "San Francisco"
    rejectPatterns:
      - "CUBLAS_STATUS"
      - "CUDA error"

  - name: Check GPU memory
    command: docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv
    expectPatterns:
      - "[0-9]+ MiB"

  - name: Check GPU count
    command: |
      output=$(docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader)
      echo "$output"
      active=$(echo "$output" | grep -c 'MiB')
      total=$(echo "$output" | grep -oP '[0-9]+(?= MiB)' | paste -sd+ | bc)
      echo "Active GPUs: $active, Total VRAM: ${total} MiB"
      if [ "$active" -le 1 ]; then
        echo "GPU_COUNT_OK"
      elif [ "$total" -le $(( (active - 1) * 11441 )) ]; then
        echo "GPU_COUNT_EXCEEDED: total ${total} MiB fits in $((active - 1)) GPUs but using $active"
      else
        echo "GPU_COUNT_OK"
      fi
    expectPatterns:
      - "GPU_COUNT_OK"
    rejectPatterns:
      - "GPU_COUNT_EXCEEDED"

  - name: Unload model
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"functiongemma:270m","keep_alive":0}'
      echo "Model unloaded"
    expectPatterns:
      - "Model unloaded"

criteria: |
  Validate FunctionGemma (270M params) generates valid tool calls on K80 (compute 3.7).
  This is a small model ideal for CI — fast to load and test.
  Prerequisite: Model must be pre-pulled before running this test.

  Expected:
  - Model maps natural language intent to the correct function (get_weather)
  - Model extracts the correct argument (San Francisco) from context
  - GPU memory is allocated (visible in nvidia-smi)
  - GPU count: model must not use more GPUs than needed. Each K80 GPU has 11441 MiB.
    If total VRAM fits in (active_gpus - 1) GPUs, the model is wasting GPUs.
  - No CUDA/CUBLAS errors in output
  - Model unloads successfully
