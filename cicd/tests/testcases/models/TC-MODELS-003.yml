id: TC-MODELS-003
name: deepseek-r1:1.5b Inference
suite: models
priority: 3
timeout: 900000
dependencies: []
intent:
  user_story: |
    Verify deepseek-r1:1.5b answers on the K80

steps:
  - name: Test inference
    command: |
      out=$(curl -s http://localhost:11434/api/generate \
        -d '{"model":"deepseek-r1:1.5b","prompt":"What is 2+2? Answer in one short sentence.","stream":false,"options":{"num_predict":400,"temperature":0,"seed":0}}')
      echo "$out" | jq -r '"response: " + (.response // "" | .[0:400])'
      echo "$out" | jq -c '{error, done, done_reason, eval_count}'
      { [ -n "$out" ] && echo "$out" | jq -e '.error == null and .done == true' >/dev/null 2>&1; } \
        && echo "LOAD_OK" || echo "LOAD_FAIL"
    expectPatterns:
      - "LOAD_OK"
    rejectPatterns:
      - "LOAD_FAIL"
      - "CUBLAS_STATUS"
      - "CUDA error"

  - name: Check GPU memory
    command: docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv
    expectPatterns:
      - "[0-9]+ MiB"

  - name: Check GPU count
    command: |
      # Die placement is not deterministic across loads: now and then a model spills a
      # small allocation onto one die more than it needs. Reload once before calling
      # it a regression; overshooting twice is one.
      die_check() {
        output=$(docker exec ollama37 nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader)
        echo "$output"
        active=$(echo "$output" | grep -c 'MiB')
        total=$(echo "$output" | grep -oP '[0-9]+(?= MiB)' | paste -sd+ | bc)
        echo "Active GPUs: $active, Total VRAM: ${total} MiB"
        [ "$active" -le 1 ] || [ "$total" -gt $(( (active - 1) * 11441 )) ]
      }
      if die_check; then
        echo "GPU_COUNT_OK"
      else
        echo "RELOAD: ${total} MiB fits in $((active - 1)) GPUs but using $active; reloading once"
        curl -s http://localhost:11434/api/generate -d '{"model":"deepseek-r1:1.5b","keep_alive":0}' >/dev/null
        curl -s http://localhost:11434/api/generate \
          -d '{"model":"deepseek-r1:1.5b","prompt":"What is 2+2? Answer in one short sentence.","stream":false,"options":{"num_predict":400,"temperature":0,"seed":0}}' >/dev/null
        if die_check; then
          echo "GPU_COUNT_OK (after one reload)"
        else
          echo "GPU_COUNT_EXCEEDED: total ${total} MiB fits in $((active - 1)) GPUs but using $active, twice"
        fi
      fi
    expectPatterns:
      - "GPU_COUNT_OK"
    rejectPatterns:
      - "GPU_COUNT_EXCEEDED"

  - name: Unload model
    command: |
      curl -s http://localhost:11434/api/generate \
        -d '{"model":"deepseek-r1:1.5b","keep_alive":0}'
      echo "Model unloaded"
    expectPatterns:
      - "Model unloaded"

criteria: |
  Verify deepseek-r1:1.5b loads on the K80, answers in readable language and gives its dies back:
  - The model loads and the request completes (the inference step shows "LOAD_OK")
  - The reply is language a person can read, not emptiness or repeated junk; a wrong
    answer is still a pass (api/generate shows a readable "response")
  - Weights are resident on the GPU (nvidia-smi shows "<N> MiB")
  - No more dies than the footprint needs (the die check shows "GPU_COUNT_OK")
  - Model unloads (api/generate with keep_alive 0 shows "Model unloaded")
