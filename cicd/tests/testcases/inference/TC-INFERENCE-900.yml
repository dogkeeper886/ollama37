id: TC-INFERENCE-900
name: Prefill/decode progress lines appear in the container log
suite: inference
priority: 900
timeout: 900000
dependencies: []
intent:
  user_story: |
    TEMPORARY verification scaffolding for #464 (STORY-023). Confirms that a long
    request writes prefill and decode progress to the container log *while it runs*,
    and a summary when it ends.

  notes: |
    DELETE THIS FILE before the PR. It asserts llamarunner-only behaviour, so it fails
    on any model the Go engine claims (gemma3, qwen3*, gpt-oss, … — see
    fs/ggml/ggml.go OllamaEngineRequired), including the inference suite's default
    gemma3:4b. Run it explicitly with a llama.cpp-engine model:

      gh workflow run test-inference.yml --ref issue-464-prefill-decode-log \
        -f runner_label=sm37 -f test_id=TC-INFERENCE-900 -f model=deepseek-r1:7b

    Once #465 instruments the Go engine too, a permanent testcase can assert these
    lines for any model.

steps:
  - name: Long request, then read the log it wrote while running
    timeout: 900000
    command: |
      set -u
      m="${TEST_MODEL:-deepseek-r1:7b}"

      docker exec ollama37 ollama show "$m" >/dev/null 2>&1 || docker exec ollama37 ollama pull "$m"

      # ~6k tokens of prompt so prefill runs well past the 3s floor the lines gate on
      para="The Tesla K80 is a dual-GPU accelerator built on the Kepler architecture with compute capability 3.7. "
      long=""
      for i in $(seq 1 400); do long="$long$para"; done
      long="$long

      Summarise the paragraph above in two sentences."

      body=$(jq -nc --arg m "$m" --arg p "$long" \
        '{model:$m, prompt:$p, stream:false, options:{num_predict:150, num_ctx:8192}}')

      start=$(date -u +%Y-%m-%dT%H:%M:%S)
      echo "=== COLD REQUEST (since $start) ==="
      curl -s http://localhost:11434/api/generate -d "$body" \
        | jq -r '"API: prompt_eval_count=\(.prompt_eval_count) prompt_eval_duration=\(.prompt_eval_duration) eval_count=\(.eval_count) eval_duration=\(.eval_duration)"'

      echo "=== LOG LINES (cold) ==="
      docker logs ollama37 --since "$start" 2>&1 \
        | grep -E "prefill progress|prefill done|decode progress|msg=completion" || echo "NO_PROGRESS_LINES"

      # --- warm cache ---------------------------------------------------------
      # A prompt that fills num_ctx cannot be reused: generation pushes the total
      # past the window, the slot shifts, and the next request re-prefills from
      # scratch. Use a prompt short enough that the slot survives, so the second
      # request genuinely hits the cache.
      short=""
      for i in $(seq 1 100); do short="$short$para"; done
      short="$short

      Reply with one short sentence."
      sbody=$(jq -nc --arg m "$m" --arg p "$short" \
        '{model:$m, prompt:$p, stream:false, options:{num_predict:20, num_ctx:8192}}')

      echo "=== WARM: priming request ==="
      curl -s http://localhost:11434/api/generate -d "$sbody" >/dev/null

      warm=$(date -u +%Y-%m-%dT%H:%M:%S)
      echo "=== WARM: repeat of the same prompt (since $warm) ==="
      api_count=$(curl -s http://localhost:11434/api/generate -d "$sbody" | jq -r '.prompt_eval_count')
      echo "API: prompt_eval_count=$api_count"

      echo "=== LOG LINES (warm) ==="
      docker logs ollama37 --since "$warm" 2>&1 | grep -E "msg=completion" || echo "NO_WARM_LINES"

      log_tokens=$(docker logs ollama37 --since "$warm" 2>&1 \
        | grep "msg=completion" | tail -1 \
        | sed -n 's/.*prefill_tokens=\([0-9]*\).*/\1/p')

      # The API counts the whole prompt; the log counts only what was computed. If
      # they match on a cache hit, the log is reporting a rate the hardware never hit.
      if [ -n "$log_tokens" ] && [ "$api_count" -gt 500 ] && [ "$log_tokens" -lt 100 ]; then
        echo "WARM_CACHE_OK: log prefill_tokens=$log_tokens vs API prompt_eval_count=$api_count"
      else
        echo "WARM_CACHE_BAD: log prefill_tokens=${log_tokens:-none} vs API prompt_eval_count=$api_count"
      fi

    expectPatterns:
      - "prefill progress"
      - "prefill done"
      - "decode progress"
      - "msg=completion"
      - "WARM_CACHE_OK"
    rejectPatterns:
      - "NO_PROGRESS_LINES"
      - "WARM_CACHE_BAD"
      - "CUDA error"
      - "tokens=0 "

  - name: A client that hangs up mid-generation still gets a summary
    timeout: 300000
    command: |
      set -u
      m="${TEST_MODEL:-deepseek-r1:7b}"

      cut=$(date -u +%Y-%m-%dT%H:%M:%S)
      # Ask for far more than it can produce in the time allowed, then cut the
      # connection. The runner tears the sequence down with DoneReasonConnectionClosed,
      # whose String() is empty — the summary should say "closed", not blank.
      curl -s --max-time 8 http://localhost:11434/api/generate \
        -d "{\"model\":\"$m\",\"prompt\":\"Count slowly from one to five hundred in words.\",\"stream\":true,\"options\":{\"num_predict\":500}}" \
        >/dev/null 2>&1 || true

      sleep 5
      echo "=== LOG LINES (after disconnect) ==="
      docker logs ollama37 --since "$cut" 2>&1 | grep -E "msg=completion" || echo "NO_DISCONNECT_SUMMARY"

      if docker logs ollama37 --since "$cut" 2>&1 | grep -q "msg=completion.*reason=closed"; then
        echo "DISCONNECT_OK: summary written with reason=closed"
      else
        echo "DISCONNECT_BAD: no reason=closed summary after the client hung up"
      fi
    expectPatterns:
      - "DISCONNECT_OK"
    rejectPatterns:
      - "DISCONNECT_BAD"
      - "NO_DISCONNECT_SUMMARY"

  - name: Unload
    command: |
      m="${TEST_MODEL:-deepseek-r1:7b}"
      curl -s http://localhost:11434/api/generate -d "{\"model\":\"$m\",\"keep_alive\":0}" >/dev/null
      echo "UNLOADED"
    expectPatterns:
      - "UNLOADED"

criteria: |
  A long request must write progress to the container log while it is still running.

  Expected in the cold run's log:
  - one or more "prefill progress" lines with rising tokens and a tps value
  - a "prefill done" line when the prompt lands
  - one or more "decode progress" lines carrying tps and tps_recent
  - a "completion" line with both phases' tokens/elapsed/tps

  Expected in the warm run (WARM_CACHE_OK):
  - a "completion" line whose prefill_tokens is far below the API's prompt_eval_count
    for the same request — the cached prefix cost no compute, so counting it would
    report a prefill rate the hardware cannot reach
  - the priming prompt must be short enough to leave room for what it generates:
    a prompt that fills num_ctx shifts the slot and is fully re-prefilled next time,
    which looks like a cache miss because it is one

  Not expected:
  - "tokens=0 " on any line (a sequence charged for time it did not spend)
