id: TC-BUILD-004
name: Retag local build as the compose image
suite: build
priority: 4
timeout: 60000
dependencies:
  - TC-BUILD-002
intent:
  user_story: |
    Retag the freshly-built ollama37:latest as the image docker compose reads

steps:
  - name: Retag ollama37:latest as the compose image
    command: |
      echo "Retagging ollama37:latest -> dogkeeper886/ollama37:latest (local, for compose)"
      docker tag ollama37:latest dogkeeper886/ollama37:latest
      docker image inspect dogkeeper886/ollama37:latest --format 'retagged {{.Id}}'
    expectPatterns:
      - "retagged sha256:"
    rejectPatterns:
      - "No such image"

criteria: |
  Verify the freshly-built runtime image carries the tag docker compose reads:
  - The compose tag resolves to an image (docker image inspect dogkeeper886/ollama37:latest shows "retagged sha256:")
  - The build produced a source image to retag (docker tag shows no "No such image")
