id: TC-BUILD-003
name: Runtime Image Slimness
suite: build
priority: 2
timeout: 60000
dependencies:
  - TC-BUILD-001
  - TC-BUILD-002
intent:
  user_story: |
    Verify the multi-stage build ships a slim runtime image

steps:
  - name: Check runtime image size
    command: "size=$(docker images ollama37:latest --format '{{.Size}}'); echo \"$size\"; numfmt --from=iec \"${size%B}\" | awk '{gb=$1/1073741824; if (gb >= 1 && gb <= 3) print \"SIZE_OK\"; else print \"SIZE_FAIL: \" gb \"GB\"}'"
    expectPatterns:
      - "SIZE_OK"

criteria: |
  Verify the ollama37 runtime image ships without the toolchain it was built with:
  - Runtime image carries no build toolchain (docker images shows ollama37:latest at 1-3 GB)
