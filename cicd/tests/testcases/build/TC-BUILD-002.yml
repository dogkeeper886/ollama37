id: TC-BUILD-002
name: Runtime Image Build
suite: build
priority: 2
timeout: 3600000
dependencies:
  - TC-BUILD-001
intent:
  user_story: |
    Build the ollama37 runtime Docker image from local source successfully

steps:
  - name: Navigate and build runtime image
    command: cd ${OLLAMA37_ROOT}/docker && OLLAMA_VERSION=${OLLAMA_VERSION:-0.0.0} make build-runtime-local-no-cache 2>&1
    timeout: 3600000
    expectPatterns:
      - "Runtime image built successfully"
    rejectPatterns:
      - "error:"
      - "Error:"

  - name: Verify runtime image exists
    command: docker images ollama37:latest --format '{{.Repository}}:{{.Tag}} {{.Size}}'
    expectPatterns:
      - "ollama37:latest"

criteria: |
  Verify the ollama37 runtime Docker image builds from local source and is tagged:
  - Build reports success (make build-runtime-local-no-cache shows "Runtime image built successfully")
  - Build completes without errors (make build-runtime-local-no-cache shows no "error:" or "Error:")
  - Image is tagged for later stages (docker images shows "ollama37:latest")
