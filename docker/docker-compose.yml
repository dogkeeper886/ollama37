services:
  ollama:
    image: ollama37:latest
    container_name: ollama37
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_DEBUG=${OLLAMA_DEBUG:-}
      # K80 perf defaults — see docker/.env.example to override.
      # Flash attention is left unset (not pinned): ollama's hardware gate forces it
      # off on the K80 (sm_37) anyway — it's a net loss there (see #346) — and we don't
      # auto-enable it on the experimental cc>=7.0 cards. Set OLLAMA_FLASH_ATTENTION=1
      # to turn it on where supported. With FA off, q8_0 KV needs FA, so cache is f16.
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-f16}
      # Compute-buffer safety margin (#352). Default 3.5 over-reserves on the K80's
      # small dies, offloading large models to CPU. Lower it (e.g. 1.5-2.0) to keep
      # large models on GPU — but not so low it trips "failed to allocate compute
      # buffers". Unset = use the built-in 3.5 default.
      - OLLAMA_GRAPH_SAFETY_MULTIPLIER=${OLLAMA_GRAPH_SAFETY_MULTIPLIER:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  ollama-data:
    external: true
